name: Build and publish VPadConnect beta

on:
  push:
    branches: [main]
    paths:
      - ".github/release-beta.request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpadconnect-beta-release
  cancel-in-progress: true

jobs:
  release:
    name: Test, build, publish, then clean up
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read and validate release version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content ".github/release-beta.request" -Raw).Trim()
          if ($version -notmatch '^0\.\d+\.\d+-beta\.\d+$') {
            throw "Expected a pre-1.0 beta version such as 0.2.1-beta.1, got '$version'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: pwsh
        run: |
          $env:PIP_DEFAULT_TIMEOUT = "30"
          $env:PIP_RETRIES = "1"
          $env:PIP_PROGRESS_BAR = "off"
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 --upgrade pip
          # Python 3.12 uses the stable PySide6 wheel from PyPI. The optional
          # Qt development index is only needed by the Python 3.15 marker, so
          # omit that global extra-index directive for this Windows release job.
          $requirements = Get-Content "requirements.txt" | Where-Object { $_ -notmatch '^\s*--extra-index-url\b' }
          $requirements | Set-Content ".release-requirements.txt" -Encoding utf8
          python -m pip install -r .release-requirements.txt
          python -m pip install pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python source and tests
        shell: pwsh
        run: python -m compileall -q core ui tests main.py

      - name: Run Python regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Validate Web Companion JavaScript
        shell: pwsh
        run: node --check ui/web/static/app.js

      - name: Run browser touch-input tests
        shell: pwsh
        run: node --test tests/test_web_frontend.cjs

      - name: Build the one-file Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm VPadConnect_onefile.spec
          $exe = Join-Path $PWD "dist/VPadConnect.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "PyInstaller did not produce dist/VPadConnect.exe."
          }
          $file = Get-Item $exe
          if ($file.Length -lt 1000000) {
            throw "The packaged executable is unexpectedly small ($($file.Length) bytes)."
          }
          Write-Host "Built $($file.FullName) ($($file.Length) bytes)"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/VPadConnect.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VPadConnect.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Publish the beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: VPadConnect ${{ steps.meta.outputs.version }} — Beta
          body_path: .github/release-notes/${{ steps.meta.outputs.version }}.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            dist/VPadConnect.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the new release and its assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v$env:RELEASE_VERSION"
          $hasExe = gh api "repos/$repo/releases/tags/$tag" --jq 'any(.assets[]; .name == "VPadConnect.exe")'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the new release." }
          $hasChecksum = gh api "repos/$repo/releases/tags/$tag" --jq 'any(.assets[]; .name == "SHA256SUMS.txt")'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the checksum asset." }
          if ($hasExe.Trim() -ne "true" -or $hasChecksum.Trim() -ne "true") {
            throw "The new beta release or one of its expected assets is missing; refusing to delete old releases or branches."
          }
          Write-Host "Verified $tag contains VPadConnect.exe and SHA256SUMS.txt."

      - name: Delete historical GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $newTag = "v$env:RELEASE_VERSION"
          $releaseIds = gh api --paginate "repos/$repo/releases" --jq '.[].id'
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases; refusing repository cleanup." }
          foreach ($line in ($releaseIds -split "`r?`n")) {
            $id = $line.Trim()
            if (-not $id) { continue }
            $existingTag = gh api "repos/$repo/releases/$id" --jq '.tag_name'
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $id; refusing further cleanup." }
            if ($existingTag.Trim() -eq $newTag) {
              continue
            }
            Write-Host "Deleting previous release $existingTag (id $id)"
            gh api --method DELETE "repos/$repo/releases/$id"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete old release $existingTag; branch cleanup will not run." }
          }
          Write-Host "Historical releases removed; the new beta release is retained."

      - name: Delete every branch except main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $branchNames = gh api --paginate "repos/$repo/branches" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not list branches; refusing branch cleanup." }
          foreach ($line in ($branchNames -split "`r?`n")) {
            $branch = $line.Trim()
            if (-not $branch -or $branch -eq "main") { continue }
            Write-Host "Deleting branch: $branch"
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete branch '$branch'." }
          }
          $remaining = gh api --paginate "repos/$repo/branches" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify remaining branches." }
          $remainingNames = @($remaining -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($remainingNames.Count -ne 1 -or $remainingNames[0] -ne "main") {
            throw "Branch cleanup did not leave exactly one branch named main."
          }
          Write-Host "Branch cleanup verified: main is the only remaining branch."
