name: Test PySide6 mobile source (no APK)

on:
  push:
    branches: [main]
    paths:
      - "mobile_pyside6/**"
      - ".github/workflows/mobile-pyside6-tests.yml"
  pull_request:
    paths:
      - "mobile_pyside6/**"
      - ".github/workflows/mobile-pyside6-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mobile_pyside6/requirements.txt

      - name: Install desktop Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libdouble-conversion3 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1

      - name: Install Python dependencies
        working-directory: mobile_pyside6
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        working-directory: mobile_pyside6
        run: python -m compileall -q main.py test_mobile_client.py

      - name: Run protocol and state unit tests
        working-directory: mobile_pyside6
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v

      - name: Confirm no package build is requested
        run: |
          if find mobile_pyside6 -type f -name '*.apk' -print -quit | grep -q .; then
            echo "Unexpected APK file found in the source tree." >&2
            exit 1
          fi
          echo "Source validation only; no APK/AAB build or release is performed."
