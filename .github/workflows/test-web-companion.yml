name: Test Web Companion (no package build)

on:
  push:
    branches: [main]
    paths:
      - "core/mouse.py"
      - "core/mapper.py"
      - "core/settings.py"
      - "core/dev_logging.py"
      - "core/web_remote.py"
      - "core/remote_protocol.py"
      - "core/remote_actions.py"
      - "core/remote_security.py"
      - "ui/web/**"
      - "ui/pages/web_remote.py"
      - "ui/main_window.py"
      - "ui/animations.py"
      - "ui/i18n.py"
      - "tests/test_web_remote.py"
      - "tests/test_remote_protocol.py"
      - "tests/test_remote_actions.py"
      - "tests/test_remote_security.py"
      - "tests/test_mouse_failsafe.py"
      - "tests/test_dev_logging.py"
      - "tests/test_settings_runtime.py"
      - "tests/test_web_frontend.cjs"
      - "requirements.txt"
      - "VPadConnect*.spec"
      - ".github/workflows/test-web-companion.yml"
  pull_request:
    paths:
      - "core/mouse.py"
      - "core/mapper.py"
      - "core/settings.py"
      - "core/dev_logging.py"
      - "core/web_remote.py"
      - "core/remote_protocol.py"
      - "core/remote_actions.py"
      - "core/remote_security.py"
      - "ui/web/**"
      - "ui/pages/web_remote.py"
      - "ui/main_window.py"
      - "ui/animations.py"
      - "ui/i18n.py"
      - "tests/test_web_remote.py"
      - "tests/test_remote_protocol.py"
      - "tests/test_remote_actions.py"
      - "tests/test_remote_security.py"
      - "tests/test_mouse_failsafe.py"
      - "tests/test_dev_logging.py"
      - "tests/test_settings_runtime.py"
      - "tests/test_web_frontend.cjs"
      - "requirements.txt"
      - "VPadConnect*.spec"
      - ".github/workflows/test-web-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-companion-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Flask>=3.0,<4.0" "cryptography>=42.0" "simple-websocket>=1.1,<2.0" pytest

      - name: Compile changed Python modules
        run: |
          python -m compileall -q core/mouse.py core/mapper.py core/settings.py core/dev_logging.py core/vigem.py tests/test_mouse_failsafe.py tests/test_dev_logging.py tests/test_settings_runtime.py core/web_remote.py core/remote_protocol.py ui/animations.py ui/vigem_gate.py ui/pages/settings.py ui/pages/controller_emulation.py ui/pages/controllers.py ui/pages/web_remote.py ui/main_window.py tests/test_web_remote.py tests/test_remote_protocol.py

      - name: Test settings persistence and developer logging
        run: python -m pytest -q tests/test_dev_logging.py tests/test_settings_runtime.py

      - name: Test relative mouse failsafe recovery
        run: python -m pytest -q tests/test_mouse_failsafe.py

      - name: Validate browser JavaScript syntax
        run: node --check ui/web/static/app.js

      - name: Test browser touch input lifecycle
        run: node --test tests/test_web_frontend.cjs

      - name: Run web protocol, session, and security-header tests
        run: python -m pytest -q tests/test_web_remote.py tests/test_remote_protocol.py tests/test_remote_security.py

      - name: Run permission-gated remote action tests
        run: python -m pytest -q tests/test_remote_actions.py
