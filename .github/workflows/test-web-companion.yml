name: Test Web Companion (no package build)

on:
  push:
    branches: [main]
    paths:
      - "core/web_remote.py"
      - "ui/web/**"
      - "ui/pages/web_remote.py"
      - "ui/main_window.py"
      - "ui/i18n.py"
      - "tests/test_web_remote.py"
      - "tests/test_web_frontend.cjs"
      - "requirements.txt"
      - "InputBridge-Gamepad2XInput*.spec"
      - ".github/workflows/test-web-companion.yml"
  pull_request:
    paths:
      - "core/web_remote.py"
      - "ui/web/**"
      - "ui/pages/web_remote.py"
      - "ui/main_window.py"
      - "ui/i18n.py"
      - "tests/test_web_remote.py"
      - "tests/test_web_frontend.cjs"
      - "requirements.txt"
      - "InputBridge-Gamepad2XInput*.spec"
      - ".github/workflows/test-web-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-companion-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Flask>=3.0,<4.0" "cryptography>=42.0" pytest

      - name: Compile changed Python modules
        run: |
          python -m compileall -q core/web_remote.py ui/pages/web_remote.py ui/main_window.py tests/test_web_remote.py

      - name: Validate browser JavaScript syntax
        run: node --check ui/web/static/app.js

      - name: Test browser touch input lifecycle
        run: node --test tests/test_web_frontend.cjs

      - name: Run web protocol, session, and security-header tests
        run: python -m pytest -q tests/test_web_remote.py

      - name: Confirm no mobile package was built
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path mobile_pyside6 -Filter *.apk -Recurse -ErrorAction SilentlyContinue
          if ($packages.Count -gt 0) { throw "Unexpected APK output in a source-validation workflow." }
          Write-Output "Web source and tests only; no APK/AAB build or release is performed."
