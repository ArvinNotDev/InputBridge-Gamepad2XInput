name: Publish latest PySide6 mobile APK

on:
  workflow_run:
    workflows: ["Build PySide6 Android client"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK built by the completed workflow
        uses: actions/download-artifact@v4
        with:
          name: InputBridge-Mobile-Android-arm64
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify installable package
        run: |
          test -s dist/InputBridge-Mobile-Android-arm64.apk
          sha256sum dist/InputBridge-Mobile-Android-arm64.apk

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: InputBridge Mobile — Latest PySide6 APK
          body: |
            Automatically generated Android companion client for InputBridge.

            - Download: InputBridge-Mobile-Android-arm64.apk
            - Architecture: ARM64 (arm64-v8a)
            - This rolling prerelease is replaced after each successful main-branch Android build.
            - No local Android build toolchain is required.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/InputBridge-Mobile-Android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
