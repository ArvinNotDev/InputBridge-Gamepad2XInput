name: Build PySide6 Android client

on:
  push:
    branches: [main]
    paths:
      - "mobile_pyside6/**"
      - ".github/workflows/mobile-pyside6-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mobile_pyside6/requirements.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip build-essential libffi-dev libssl-dev git libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libxcb-render-util0 libxcb-image0 libxcb-util1 libdouble-conversion3
          java -version

      - name: Install Qt for Python and QR dependencies
        working-directory: mobile_pyside6
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source and pairing protocol
        working-directory: mobile_pyside6
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py test_mobile_client.py
          python -m unittest -v

      - name: Install open-source Qt SDK for Android and host
        working-directory: mobile_pyside6
        run: |
          python -m pip install --upgrade aqtinstall
          aqt install-qt linux desktop 6.11.0 linux_gcc_64 -O "$RUNNER_TEMP/Qt" -m qtmultimedia qtsensors
          aqt install-qt linux android 6.11.0 android_arm64_v8a -O "$RUNNER_TEMP/Qt" -m qtmultimedia qtsensors
          test -d "$RUNNER_TEMP/Qt/6.11.0/gcc_64"
          test -d "$RUNNER_TEMP/Qt/6.11.0/android_arm64_v8a"

      - name: Prepare Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.11 https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          cd "$RUNNER_TEMP/pyside-setup"
          python -m pip install -r requirements.txt -r tools/cross_compile_android/requirements.txt
          python tools/cross_compile_android/main.py \
            --plat-name aarch64 --download-only --skip-update --auto-accept-license

      - name: Download official PySide6 and Shiboken Android wheels
        env:
          QT_FOR_PYTHON_VERSION: "6.11.0"
        run: |
          WHEEL_DIR="$RUNNER_TEMP/android-wheels"
          mkdir -p "$WHEEL_DIR"
          PYSIDE_WHEEL="$WHEEL_DIR/pyside6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$WHEEL_DIR/shiboken6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"
          curl --fail --location --show-error --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl" \
            --output "$PYSIDE_WHEEL"
          curl --fail --location --show-error --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl" \
            --output "$SHIBOKEN_WHEEL"
          python -m zipfile -t "$PYSIDE_WHEEL"
          python -m zipfile -t "$SHIBOKEN_WHEEL"
          sha256sum "$PYSIDE_WHEEL" "$SHIBOKEN_WHEEL"

      - name: Package Android APK
        working-directory: mobile_pyside6
        run: |
          PYSIDE_WHEEL="$RUNNER_TEMP/android-wheels/pyside6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$RUNNER_TEMP/android-wheels/shiboken6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"
          python deploy_android.py "$PYSIDE_WHEEL" "$SHIBOKEN_WHEEL"

      - name: Stage APK
        run: |
          mkdir -p mobile_pyside6/dist
          APK="$(find mobile_pyside6 -type f -name '*.apk' -not -path '*/.venv/*' -print -quit)"
          test -n "$APK"
          cp "$APK" mobile_pyside6/dist/InputBridge-Mobile-Android-arm64.apk
          sha256sum mobile_pyside6/dist/InputBridge-Mobile-Android-arm64.apk

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: InputBridge-Mobile-Android-arm64
          path: mobile_pyside6/dist/InputBridge-Mobile-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14
